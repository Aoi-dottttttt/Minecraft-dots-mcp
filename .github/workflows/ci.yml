name: Offline verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify source publication manifest
        run: python3 scripts/publication-manifest.py --check
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix vendor/awesome-mineflayer-mcp
      - name: Build and verify offline
        run: |
          npm run build:upstream
          npm run verify
          npm run test:upstream
      - name: Ensure tracked source was not changed by tests
        run: git diff --exit-code
